[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "connection-risk"
version = "0.4.0a0"
description = "Offline probabilistic risk estimates for self-transfer flight connections"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "connection-risk contributors" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "scipy>=1.13",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27"]
benchmark = ["matplotlib>=3.9", "pyarrow>=17"]

[project.scripts]
connection-risk = "connection_risk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/connection_risk"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
