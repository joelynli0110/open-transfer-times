# Schengen membership used to decide whether a transfer crosses the Schengen
# border (and therefore needs passport control).
#
# countries: authoritative membership list, by ISO 3166-1 alpha-2 code. Every
#            airport is classified by its country in the airport catalog
#            (OurAirports), so all ~9,000 airports are covered.
# outside_schengen: airports in a member country that are nonetheless outside
#            the Schengen area. Overseas territories with their own ISO code
#            (RE, GP, FO, GL, …) need no entry: their code is not a member.

countries:
  AT: Austria
  BE: Belgium
  BG: Bulgaria
  HR: Croatia
  CZ: Czech Republic
  DK: Denmark
  EE: Estonia
  FI: Finland
  FR: France
  DE: Germany
  GR: Greece
  HU: Hungary
  IS: Iceland
  IT: Italy
  LV: Latvia
  LI: Liechtenstein
  LT: Lithuania
  LU: Luxembourg
  MT: Malta
  NL: Netherlands
  NO: Norway
  PL: Poland
  PT: Portugal
  RO: Romania
  SK: Slovakia
  SI: Slovenia
  ES: Spain
  SE: Sweden
  CH: Switzerland

source:
  title: Schengen
  publisher: Swiss State Secretariat for Migration (SEM)
  url: https://www.sem.admin.ch/sem/en/home/themen/einreise/fachinfo-einreise/schengen.html
  note: Page lists 29 Schengen member states (last modified 12.10.2025). Cyprus and Ireland are EU members outside Schengen.
  retrieved: 2026-10-29

outside_schengen:
  LYR: Svalbard (Norway) is outside the Schengen area.
