# Schengen membership used to decide whether a transfer crosses the Schengen
# border (and therefore needs passport control).
#
# countries: authoritative membership list, by ISO 3166-1 alpha-2 code.
# airports:  IATA codes the engine currently classifies. Until the airport
#            catalog carries a country for every airport, the engine can only
#            classify airports listed here; everything else is "unknown".
#            Each airport below must belong to one of the listed countries.

