name: Bug report
description: Wrong result, crash, or a problem with the engine, MCP server or extension.
labels: ["bug"]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options:
        - Engine (open-transfer-times)
        - MCP server (open-transfer-times-mcp)
        - Chrome extension
        - Airport data build / validation
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The itinerary or tool call, e.g. from, via, to, times or layover_minutes, ticket.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: open-transfer-times-mcp 0.1.1, Node 22, Windows 11, Claude Desktop
