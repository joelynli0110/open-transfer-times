# Transfer profile for Dubai (DXB).
# Field reference: CONTRIBUTING.md#airport-file-format
iata: DXB
name: Dubai
country: AE
timezone: Asia/Dubai
last_reviewed: 2026-10-29

# Minutes the engine deducts from the scheduled layover.
# basis: heuristic = rule-of-thumb estimate, not yet backed by a source.
# basis: sourced   = derived from the facts/sources below (list them in 'sources').
allowances:
  base_transfer: { minutes: 35, basis: heuristic }
  passport_control: { minutes: 0, basis: heuristic }
  terminal_change: { minutes: 20, basis: heuristic }
  security_rescreening: { minutes: 10, basis: heuristic }

# Verifiable statements about the transfer process, each tied to a source.
facts:
  - id: separate-ticket-recheck
    claim: Passengers on separate tickets who do not need a visa (or hold a Dubai visa) must clear passport control, collect their bags and check in again for the connecting flight.
    source: dxb-transfers
  - id: airport-trains
    claim: Terminal 1 D gates and Terminal 3 A gates are reached by a short airport train ride; Terminal 3 B and C gates are connected on foot.
    source: dxb-transfers

sources:
  dxb-transfers:
    title: Transfers
    publisher: Dubai Airports
    url: https://dubaiairports.ae/information/transfers
    retrieved: 2026-10-29
