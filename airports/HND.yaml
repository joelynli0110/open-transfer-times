# Transfer profile for Tokyo Haneda (HND).
# Field reference: CONTRIBUTING.md#airport-file-format
iata: HND
name: Tokyo Haneda
country: JP
timezone: Asia/Tokyo
last_reviewed: 2026-10-29

# Minutes the engine deducts from the scheduled layover.
# basis: heuristic = rule-of-thumb estimate, not yet backed by a source.
# basis: sourced   = derived from the facts/sources below (list them in 'sources').
allowances:
  base_transfer: { minutes: 35, basis: heuristic }
  passport_control: { minutes: 0, basis: heuristic }
  terminal_change: { minutes: 20, basis: heuristic, facts: [international-transit-bus] }
  security_rescreening: { minutes: 10, basis: heuristic, facts: [transit-security-checkpoint] }

# Verifiable statements about the transfer process, each tied to a source.
facts:
  - id: international-transit-bus
    claim: International-to-international transfers between Terminal 2 and Terminal 3 use a dedicated international transit bus.
    source: hnd-int-int
  - id: transit-security-checkpoint
    claim: Passengers arriving at Terminal 3 on the transit bus are guided to the international transit security checkpoint.
    source: hnd-int-int

sources:
  hnd-int-int:
    title: International to International
    publisher: Tokyo International Airport (Haneda)
