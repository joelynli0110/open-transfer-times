# Transfer profile for Frankfurt (FRA).
# Field reference: CONTRIBUTING.md#airport-file-format
iata: FRA
name: Frankfurt
country: DE
last_reviewed: 2026-10-29

# Minutes the engine deducts from the scheduled layover.
# basis: heuristic = rule-of-thumb estimate, not yet backed by a source.
# basis: sourced   = derived from the facts/sources below (list them in 'sources').
# Open question: for a Schengen → non-Schengen transfer these heuristics add up
# to 55 minutes (base 35 + passport 20), below the 60-minute Lufthansa MCT cited
# below for some connection types. Needs review against an airport-level source.
allowances:
  base_transfer: { minutes: 35, basis: heuristic }
  passport_control: { minutes: 20, basis: heuristic }
  terminal_change: { minutes: 15, basis: heuristic }
  security_rescreening: { minutes: 0, basis: heuristic }

# Verifiable statements about the transfer process, each tied to a source.
facts:
  - id: lufthansa-mct-60
    claim: >-
      Lufthansa moved its FRA minimum connecting time to a 60-minute standard from 30 March 2025
      for intra-European to intra-European connections and Schengen connections to the USA,
      Singapore and South Africa, ending the earlier 45-50 minute exception.
    source: lufthansa-mct-2024
    scope: Lufthansa-operated connections only

sources:
  lufthansa-mct-2024:
    title: "Frankfurt Airport: Increase of the minimum connecting time (MCT) to 60 minutes"
    publisher: Lufthansa eXperts
    url: https://irreg.lufthansaexperts.com/en/news/frankfurt-airport-increase-of-the-minimum-connecting-time-mct-to-60-minutes.html
    published: 2024-09-10
    retrieved: 2026-10-29
