# Transfer profile for London Heathrow (LHR).
# Field reference: CONTRIBUTING.md#airport-file-format
iata: LHR
name: London Heathrow
country: GB
timezone: Europe/London
last_reviewed: 2026-11-09

# Minutes the engine deducts from the scheduled layover.
# basis: heuristic = rule-of-thumb estimate, not yet backed by a source.
# basis: derived   = computed from published figures; basis: sourced = published minutes.
# Reviewed 2026-11 (FRA/AMS/LHR deep check): Heathrow publishes no durations.
# British Airways' terminal-connection guide gives about 90 minutes for
# Terminal 5 → Terminal 3, but it dates from 2015 and needs a terminal-pair
# condition the engine cannot express yet, so it is recorded as a fact only.
allowances:
  base_transfer: { minutes: 40, basis: heuristic }
  passport_control: { minutes: 0, basis: heuristic }
  terminal_change: { minutes: 25, basis: heuristic, facts: [inter-terminal-bus] }
  security_rescreening: { minutes: 15, basis: heuristic, facts: [transfer-security] }

# Verifiable statements about the transfer process, each tied to a source.
facts:
  - id: transfer-security
    claim: All connecting passengers go through security screening again at Heathrow.
    source: heathrow-connecting
  - id: inter-terminal-bus
    claim: Connections between different terminals use a free transfer bus that runs about every 10 minutes.
    source: heathrow-connecting
  - id: ba-t5-t3-connection
    claim: British Airways' 2015 connection guide gives a minimum connection time of about 90 minutes from Terminal 5 to Terminal 3, with a flight-connections bus and another security check.
    source: ba-t5-t3
    scope: British Airways connections from Terminal 5 to Terminal 3 (2015 guidance)
  - id: no-published-mct
    claim: Heathrow does not publish a minimum connection time; travellers are told to check their airline's figure, which does not apply to separately booked flights.
    source: heathrow-connecting

sources:
  heathrow-connecting:
    title: Connecting flights
    publisher: Heathrow Airport
    url: https://www.heathrow.com/connecting-flights
    retrieved: 2026-10-29
  ba-t5-t3:
    title: "LHR flight connections: Terminal 5 to Terminal 3"
    publisher: British Airways
    url: https://www.britishairways.com/assets/pdfs/information/airport-information/lhr-connections/LHR-Flight-connections_Terminal-5-to-Terminal-3.pdf
    published: 2015-06-01
    retrieved: 2026-11-09
